name: pm-cost-uncertainty
description: >-
  A deliberately broad first model of uncertain relative mitigation cost. Values are
  ranges to test whether priorities survive plausible cost differences; they are not
  measurements or calibrated probability distributions.
decision_question: Which risk domains remain priorities across plausible mitigation costs?
objective: achievable_reduction
scenario: pm
level: catastrophic
default_cost_multiplier: 1.0
cost_multipliers: {}
default_cost_range: [1.0, 2.0]
cost_ranges:
  "6.4": [3.0, 7.0]   # competitive dynamics: multilateral coordination
  "6.5": [2.5, 6.0]   # governance failure: institutional change
  "4.2": [2.0, 5.0]   # weapons & cyberattacks: monitoring and verification
  "7.1": [1.5, 3.0]   # AI misalignment: substantial research programme
  "7.2": [1.0, 2.5]   # dangerous capabilities: evaluations in existing labs
