name: pm-maximize-reduction
description: >-
  The reading of somebody who has to allocate effort: rank domains by how much of the
  catastrophic probability the pragmatic-mitigations scenario actually removes, per unit
  of assumed mitigation cost. The cost numbers are not in any MIT dataset — they are a
  stated assumption, that mitigations needing multilateral coordination and verification
  cost several times what in-lab technical work costs.
decision_question: Where does additional mitigation effort buy the largest reduction per unit of cost?
objective: achievable_reduction
scenario: pm
level: catastrophic
default_cost_multiplier: 1.0
cost_multipliers:
  "6.4": 5.0   # competitive dynamics — needs multilateral coordination
  "6.5": 4.0   # governance failure — needs new institutions
  "4.2": 3.0   # weapons & cyberattacks — needs a verification regime
  "7.1": 2.0   # AI misalignment — a large but bounded research programme
  "7.2": 1.5   # dangerous capabilities — evaluations inside existing labs
