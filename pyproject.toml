[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "riskdlab"
version = "0.1.0"
description = "A gap map over AI risk: expert signal beside funding, per MIT risk subdomain"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pandas", "openpyxl", "rdata", "scipy", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
riskdlab = "riskdlab.cli:main"

[tool.setuptools.packages.find]
include = ["riskdlab*"]

[tool.setuptools.package-data]
riskdlab = ["funding/rubric.md", "funding/rubric_methods.md"]

[tool.pytest.ini_options]
# `experiments/` holds one-off scripts that run against raw data not in git; the suite
# lives in tests/ only.
testpaths = ["tests"]
